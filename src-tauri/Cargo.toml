[package]
name = "favorite-dir"
version = "1.0.0"
description = "本地常用目录管理工具"
authors = ["you"]
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.5", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2.2"
tauri-plugin-shell = "2.2"
tauri-plugin-fs = "2.2"
tauri-plugin-autostart = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.16", features = ["v4", "serde"] }
tokio = { version = "1.44", features = ["full"] }

[features]
default = []
