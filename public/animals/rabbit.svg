<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Left ear outer -->
  <ellipse cx="32" cy="22" rx="10" ry="28" fill="#fce7f3" stroke="#f9a8d4" stroke-width="2" transform="rotate(-15 32 22)"/>
  <ellipse cx="32" cy="22" rx="5" ry="20" fill="#fbcfe8" transform="rotate(-15 32 22)"/>
  <!-- Right ear outer -->
  <ellipse cx="68" cy="22" rx="10" ry="28" fill="#fce7f3" stroke="#f9a8d4" stroke-width="2" transform="rotate(15 68 22)"/>
  <ellipse cx="68" cy="22" rx="5" ry="20" fill="#fbcfe8" transform="rotate(15 68 22)"/>
  <!-- Face -->
  <circle cx="50" cy="58" r="32" fill="#fce7f3" stroke="#f9a8d4" stroke-width="2"/>
  <!-- Left eye -->
  <circle cx="38" cy="54" r="5" fill="#1e293b"/>
  <circle cx="40" cy="52" r="2" fill="white"/>
  <!-- Right eye -->
  <circle cx="62" cy="54" r="5" fill="#1e293b"/>
  <circle cx="64" cy="52" r="2" fill="white"/>
  <!-- Nose -->
  <ellipse cx="50" cy="64" rx="5" ry="4" fill="#f9a8d4"/>
  <!-- Mouth -->
  <path d="M50 68 Q45 74 40 70" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M50 68 Q55 74 60 70" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Teeth -->
  <rect x="46" y="68" width="4" height="5" fill="white" stroke="#e2e8f0" stroke-width="0.5"/>
  <rect x="50" y="68" width="4" height="5" fill="white" stroke="#e2e8f0" stroke-width="0.5"/>
  <!-- Blush -->
  <ellipse cx="30" cy="62" rx="6" ry="4" fill="#fca5a5" opacity="0.5"/>
  <ellipse cx="70" cy="62" rx="6" ry="4" fill="#fca5a5" opacity="0.5"/>
  <!-- Bow tie -->
  <polygon points="42,84 50,88 58,84 50,80" fill="#f472b6"/>
  <polygon points="38,82 46,86 46,78" fill="#ec4899"/>
  <polygon points="62,82 54,86 54,78" fill="#ec4899"/>
</svg>