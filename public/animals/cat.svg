<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Face -->
  <circle cx="50" cy="52" r="38" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <!-- Left ear -->
  <polygon points="18,30 30,5 42,28" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="22,26 30,12 38,26" fill="#fca5a5"/>
  <!-- Right ear -->
  <polygon points="58,28 70,5 82,30" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="62,26 70,12 78,26" fill="#fca5a5"/>
  <!-- Left eye -->
  <ellipse cx="35" cy="48" rx="8" ry="10" fill="#1e293b"/>
  <ellipse cx="37" cy="45" rx="3" ry="4" fill="#fbbf24"/>
  <circle cx="38" cy="44" r="1.5" fill="white"/>
  <!-- Right eye -->
  <ellipse cx="65" cy="48" rx="8" ry="10" fill="#1e293b"/>
  <ellipse cx="67" cy="45" rx="3" ry="4" fill="#fbbf24"/>
  <circle cx="68" cy="44" r="1.5" fill="white"/>
  <!-- Nose -->
  <polygon points="46,58 54,58 50,64" fill="#fca5a5"/>
  <!-- Mouth -->
  <path d="M50 64 Q44 70 40 66" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M50 64 Q56 70 60 66" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Whiskers left -->
  <line x1="22" y1="55" x2="8" y2="50" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
  <line x1="22" y1="60" x2="8" y2="62" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
  <!-- Whiskers right -->
  <line x1="78" y1="55" x2="92" y2="50" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
  <line x1="78" y1="60" x2="92" y2="62" stroke="#94a3b8" stroke-width="1" stroke-linecap="round"/>
  <!-- Blush -->
  <ellipse cx="25" cy="60" rx="6" ry="4" fill="#fca5a5" opacity="0.5"/>
  <ellipse cx="75" cy="60" rx="6" ry="4" fill="#fca5a5" opacity="0.5"/>
</svg>